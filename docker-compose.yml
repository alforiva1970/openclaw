services:
  openclaw-gateway:
    build: .
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_SKIP_UI_BUILD: 1
      OPENCLAW_SKIP_CHANNELS: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GEMINI_API_KEY}
      MEMORY_SERVER_URL: http://memory-server:3001
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ./config/workspace/BOOT.md:/home/node/.openclaw/workspace/BOOT.md:ro
      - ./state:/app/state
      - ${SILICEA_IDENTITY_DIR:-./config/identity-placeholder}:/identity/silicea:ro
      - ${SHARED_IDENTITY_DIR:-./config/identity-placeholder}:/identity/shared:ro
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
      - "18792:18792"
    init: true
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      memory-server:
        condition: service_healthy
    command: ["npx", "tsx", "src/index.ts", "gateway", "--allow-unconfigured", "--bind", "lan", "--port", "18789"]

  memory-server:
    build: ./config/memory-server
    environment:
      MEMORY_SERVER_PORT: 3001
      MEMORY_DATA_DIR: /app/data
      SILICEA_IDENTITY_DIR: /identity/silicea
      SHARED_IDENTITY_DIR: /identity/shared
    volumes:
      - memory-data:/app/data
      - ${SILICEA_IDENTITY_DIR:-./config/identity-placeholder}:/identity/silicea:ro
      - ${SHARED_IDENTITY_DIR:-./config/identity-placeholder}:/identity/shared:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]

volumes:
  memory-data:
